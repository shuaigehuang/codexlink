name: Feature request
description: 提议新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: component
    attributes:
      label: 组件
      options:
        - Windows 电脑端
        - Android 手机端
        - Linux 中继
        - 安装脚本
        - 文档
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前痛点，而不是只给实现方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: textarea
    id: security
    attributes:
      label: 安全影响
      description: 是否涉及鉴权、令牌、RPC 白名单、TLS 或远程命令执行
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 该请求不包含真实密钥、令牌或服务器地址
          required: true
